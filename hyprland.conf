# Small, keyboard-first starter config. The visual theme lives in waybar-style.css.
$mod = SUPER

monitor = , 2560x1080@60, auto, 1

exec-once = waybar
exec-once = mako

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(7aa2f7)
    col.inactive_border = rgb(414868)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.90
    blur {
        enabled = yes
        size = 5
        passes = 2
    }
}

animations {
    enabled = yes
    bezier = ease, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, ease
    animation = windowsOut, 1, 5, ease, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 5, ease
    animation = workspaces, 1, 5, ease
}

bind = $mod, RETURN, exec, ghostty
bind = $mod, SPACE, exec, wofi --show drun --allow-images
bind = $mod, TAB, cyclenext
bind = $mod SHIFT, TAB, cyclenext, prev
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, T, layoutmsg, togglesplit
bind = $mod, S, exec, grim -g "$(slurp)" - | wl-copy

bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, j, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:class ^(pavucontrol)$, float on
