services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    command:
      [
        "web",
        "--hostname",
        "0.0.0.0",
        "--port",
        "4096",
        "--mdns",
        "--mdns-domain",
        "dgyoc.local",
      ]
    ports:
      - "4096:4096"
    stdin_open: true
    tty: true
