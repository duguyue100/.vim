services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    command:
      [
        "web",
        "--hostname",
        "0.0.0.0",
        "--port",
        "4096",
        "--mdns",
        "--mdns-domain",
        "dgyoc.local",
      ]
    ports:
      - "4096:4096"
    volumes:
      - ./opencode-data/config:/root/.config/opencode
      - ./opencode-data/share:/root/.local/share/opencode
      - ./opencode-data/state:/root/.local/state/opencode
    stdin_open: true
    tty: true
