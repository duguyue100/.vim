background {
    monitor =
    color = rgba(239, 241, 245, 1.0)
    blur_passes = 2
    blur_size = 5
}

general {
    hide_cursor = true
    grace = 2
    disable_loading_bar = true
}

input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgb(dc8a78)
    inner_color = rgb(e6e9ef)
    font_color = rgb(4c4f69)
    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(4c4f69)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = rgb(8839ef)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}
